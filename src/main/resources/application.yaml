spring:
  application:
    name: pricing-api

  datasource:
    url: jdbc:h2:mem:pricingdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: validate
      open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

